<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Планер">
  <title>Финансовый планер</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>

  <header class="top">
    <div class="top-row">
      <h1 class="brand">Финансовый планер</h1>
      <div class="period" role="group" aria-label="Выбор периода">
        <button class="icon-btn" id="prev" type="button" aria-label="Предыдущий период">‹</button>
        <span class="period-label" id="period-label" aria-live="polite"></span>
        <button class="icon-btn" id="next" type="button" aria-label="Следующий период">›</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Разделы">
      <button type="button" class="tab" data-tab="overview">Обзор</button>
      <button type="button" class="tab" data-tab="entries">Записи</button>
      <button type="button" class="tab" data-tab="plan">План</button>
      <button type="button" class="tab" data-tab="year">Год</button>
      <button type="button" class="tab" data-tab="settings">Ещё</button>
    </nav>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="firebase-config.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
